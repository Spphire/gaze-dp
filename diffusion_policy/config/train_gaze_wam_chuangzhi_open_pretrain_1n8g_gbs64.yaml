defaults:
  - train_gaze_wam_open_pretrain_workspace
  - _self_

name: train_gaze_wam_chuangzhi_open_pretrain_1n8g_gbs64
exp_name: "chuangzhi_open_pretrain_heatmap_latent_1n8g_gbs64"

task:
  n_obs_steps: 1
  gaze_key: gaze_xy
  heatmap_key: null
  temporal_heatmap_mode: bidirectional
  temporal_heatmap_window_radius: 30
  temporal_heatmap_beta: 10.0
  temporal_heatmap_sigma_px: 6.0
  temporal_heatmap_current_weight: 2.0
  robot_heatmap_supervision: all_valid

policy:
  model_architecture: cached_dual_stream
  action_loss_weight: 0.0
  heatmap_loss_weight: 1.0

data_mixing:
  total_batch_size_per_process: 8
  robot_ratio: 0.0
  open_ratio: 1.0

open_dataloader:
  batch_size: 8
  num_workers: 4

val_open_dataloader:
  batch_size: 8
  num_workers: 2

training:
  stage: open_pretrain
  gradient_accumulate_every: 1
  num_epochs: 3000
  lr_scheduler: constant_with_warmup
  lr_warmup_steps: 2000
  checkpoint_every: 100
  checkpoint_every_steps: 30000
  latest_checkpoint_every: 1
  latest_checkpoint_every_steps: 3000
  measure_step_performance: true
  save_val_heatmap_preview: true
  save_checkpoint_heatmap_preview: true

checkpoint:
  keep_last_n: 5
  save_last_ckpt: true
  topk:
    k: 0

logging:
  mode: disabled
