defaults:
  - train_gaze_wam_robot_only_workspace
  - _self_

name: train_gaze_wam_robot_a_image_only
exp_name: "robot_a_image_only_action"

task:
  robot_dataset_path: data/gaze_wam_robot_20260814_from_162120.zarr
  n_obs_steps: 1
  robot_gaze_dropout_prob: 1.0
  robot_heatmap_on_gaze_dropout: false

policy:
  # The current architecture still instantiates its heatmap branch, but this
  # ablation removes every heatmap contribution from the training objective.
  heatmap_loss_weight: 0.0
  heatmap_token_kl_loss_weight: 0.0
  heatmap_xy_loss_weight: 0.0
  heatmap_point_nll_loss_weight: 0.0
  heatmap_js_loss_weight: 0.0
  heatmap_diffusion_final_loss_enabled: false
  obs_encoder:
    pretrained: false
    checkpoint_path: data/checkpoints/dinov3/vit_base_patch16_dinov3.lvd1689m.safetensors

training:
  num_epochs: 600

checkpoint:
  keep_last_n: 5
