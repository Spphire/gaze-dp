defaults:
  - train_gaze_wam_open_only_workspace
  - _self_

name: train_gaze_wam_open_pretrain
exp_name: "optional_open_pretrain_encoder_ablation"

task:
  # Pretrain from one RGB frame. Ground-truth gaze remains label-only and is
  # converted to the heatmap target by the open-data path.
  n_obs_steps: 1
  # Split whole episodes so nearby frames never leak across train and val.
  val_ratio: 0.05

policy:
  obs_encoder:
    # Training nodes are offline; initialize DINOv3 from the shared checkpoint.
    pretrained: false
    checkpoint_path: data/checkpoints/dinov3/vit_base_patch16_dinov3.lvd1689m.safetensors

data_mixing:
  batch_size_source: ratio
  # Keep the per-GPU batch fixed; gradient accumulation below preserves GBS512
  # for the initial two-node, 16-GPU launch.
  total_batch_size_per_process: 16
  robot_ratio: 0.0
  open_ratio: 1.0
  robot_tail_policy: drop
  open_tail_policy: pad
  validation_tail_policy: keep

training:
  stage: open_pretrain
  max_train_steps: null
  num_epochs: 3000
  # 16 samples/GPU * 16 GPUs * 2 accumulation steps = global batch 512.
  # Override this to 1 when continuing on four 8-GPU nodes.
  gradient_accumulate_every: 2
  # Disable native ZeRO state restore when changing the distributed world size.
  resume_deepspeed_state: true
  # The pretraining horizon can be extended without changing the LR curve.
  lr_scheduler: constant_with_warmup
  lr_warmup_steps: 2000
  # Step-based checkpointing takes precedence over the legacy epoch cadence.
  checkpoint_every: 1
  checkpoint_every_steps: 30000
  # Keep a recent rolling recovery point without increasing archival frequency.
  latest_checkpoint_every_steps: null
  freeze_encoder: false
  transfer:
    export_path: data/outputs/gaze_wam_open_pretrain_obs_encoder.pt
    export_scope: obs_encoder
    export_overwrite: true
