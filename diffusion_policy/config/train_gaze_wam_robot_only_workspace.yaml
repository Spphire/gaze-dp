defaults:
  - train_gaze_wam_workspace
  - _self_

name: train_gaze_wam_robot_only
exp_name: "robot_only_baseline"

data_mixing:
  batch_size_source: ratio
  total_batch_size_per_process: 64
  robot_ratio: 1.0
  open_ratio: 0.0
  robot_tail_policy: pad
  open_tail_policy: drop
  validation_tail_policy: keep

robot_dataloader:
  batch_size: 64

open_dataloader:
  batch_size: 0

val_open_dataloader:
  batch_size: 0

training:
  stage: robot_only
