defaults:
  - train_gaze_wam_robot_only_workspace
  - _self_

name: train_gaze_wam_robot_only_debug
exp_name: "robot_only_debug"

task:
  robot_dataset_path: data/debug_gaze_wam/robot.zarr
  open_dataset_path: data/debug_gaze_wam/open.zarr

policy:
  obs_encoder:
    pretrained: false
  num_inference_steps: 2
  n_layer: 1
  n_head: 4
  p_drop_emb: 0.0
  p_drop_attn: 0.0

data_mixing:
  batch_size_source: ratio
  total_batch_size_per_process: 3
  robot_ratio: 1.0
  open_ratio: 0.0
  robot_tail_policy: pad
  open_tail_policy: drop
  validation_tail_policy: keep

robot_dataloader:
  batch_size: 3
  num_workers: 0
  pin_memory: false
  persistent_workers: false

val_robot_dataloader:
  batch_size: 3
  num_workers: 0
  pin_memory: false
  persistent_workers: false

training:
  stage: robot_only
  debug: true
  require_amp: false
  num_epochs: 1
  max_train_steps: 2
  use_ema: false
  checkpoint_every: 1000
  val_every: 1
  max_val_steps: 1
  sample_every: 1000
  lr_warmup_steps: 1

logging:
  mode: disabled

checkpoint:
  save_last_ckpt: false
  save_last_snapshot: false
